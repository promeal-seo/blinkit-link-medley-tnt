<!DOCTYPE html>
<html>
<head>
  <title>Opening Blinkit...</title>
  <script>
    var productUrl = "https://blinkit.com/prn/x/prid/692040";
    var appOpened = false;
    
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        appOpened = true;
      }
    });
    
    function openInApp() {
      var ua = navigator.userAgent.toLowerCase();
      var isAndroid = /android/.test(ua);
      var isInstagram = /instagram|fbav/.test(ua);
      
      if (isAndroid) {
        // Use Intent URI with explicit flags to bypass Instagram dialog
        var intentUrl = "intent://blinkit.com/prn/x/prid/692040#Intent;scheme=https;package=com.grofers.customerapp;launchFlags=0x10000000;end;";
        
        // Try to open immediately
        window.location = intentUrl;
        
        // If Intent doesn't work, fallback to product URL after 1 second
        setTimeout(function() {
          if (!appOpened) {
            window.location = productUrl;
          }
        }, 1000);
      } else {
        // iOS/Desktop
        window.location = productUrl;
      }
    }
    
    // Open immediately without delay
    openInApp();
  </script>
</head>
<body>
  <p>Opening Blinkit...</p>
</body>
</html>
